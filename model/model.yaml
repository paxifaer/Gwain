# models.yaml

default_model: default

models:
  default:
    provider: cli
    model: default
    role: auto
    description: "由 CLI / 平台自动选择模型"

  t9s/kimi-k3:
    provider: t9s
    model: kimi-k3
    role: balanced

    capabilities:
      reasoning: high
      coding: high
      speed: high
      context: high
      multimodal: high

    suitable_for:
      - general_tasks
      - coding
      - debugging
      - task_decomposition
      - visual_debugging
      - deployment_debugging
      - ui_testing
      - screenshot_analysis


  t9s/glm-5.2:
    provider: t9s
    model: glm-5.2
    role: strong
    capabilities:
      reasoning: very_high
      coding: high
      speed: medium
      context: high
    suitable_for:
      - architecture
      - complex_reasoning
      - complex_debugging
      - large_refactoring
      - difficult_task_decomposition