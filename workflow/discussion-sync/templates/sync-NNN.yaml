# sync-NNN.yaml — template for one sync payload.
#
# USAGE
#   Copy this file to <task>/sync/<NNN>.yaml where <NNN> is the next free
#   sync_id (zero-padded to three digits on disk: 001.yaml, 002.yaml, ...).
#   The `sync_id:` field below is an integer that matches the filename.
#
#   The extractor (PROMPT-disc-extractor.md) is the only thing that creates
#   new sync files. It MUST NOT write this file if zero new content exists
#   (idempotency rule 1). It MUST NOT renumber or rewrite older sync files.
#
#   The ingest prompt (PROMPT-orch-ingest.md) is the only thing that
#   rewrites `status:`. It MUST NOT delete this file.
#
# FIELD COMMENTS
#   sync_id     : int, matches filename (001.yaml -> sync_id: 1)
#   task_id     : the kebab-case task ID matching <task>/task.md's task_id
#   source      : literal string 'discussion' (only Discussion-side payloads
#                 use this template; Orchestrator-side mutations go to the
#                 ledger, not back into a sync file)
#   created_at  : ISO-8601 UTC, set by the extractor at write time
#   status      : one of pending | applied | rejected | conflict
#                 extractor writes 'pending'; ingest rewrites to one of the
#                 other three. NEVER delete the file.
#   changes     : dict keyed by allowed categories (see protocol.md
#                 §Allowed Categories). Each value is a list of entries.
#                 An empty dict {} is allowed by the schema, but
#                 protocol.md §Idempotency rule 1 forbids the extractor
#                 from writing such a file.
#
# ENTRY FIELDS (per category)
#   requirements / decisions / constraints:
#     - id        : R-XXX / D-XXX / C-XXX, NOT already in the ledger
#     - class     : CONFIRMED | PROPOSED | EXPLORATORY (IRRELEVANT must NOT
#                   appear in the payload)
#     - content   : the requirement / decision / constraint statement
#     - reason    : why this is being recorded (source, confirmation date)
#     - revises   : null, or the ID of an existing ledger entry this entry
#                   replaces (decisions only; for MERGE disposition)
#   progress:
#     - id        : P-XXX, NOT already in the ledger
#     - content   : what was done
#     - evidence  : path to a file or test name that proves it (optional
#                   but strongly encouraged)
#   open_questions:
#     - id        : Q-XXX
#     - content   : the question
#   rejected:
#     - id        : X-XXX
#     - content   : the rejected alternative
#     - reason    : why it was rejected (REQUIRED — a rejection without a
#                   reason is forbidden by protocol.md §Forbidden Categories)

sync_id: 3                           # zero-padded on disk as 003.yaml; as int here
task_id: example-task-001
source: discussion                   # literal 'discussion'
created_at: 2026-08-14T20:30:00Z
status: pending                      # pending | applied | rejected | conflict

changes: {}                          # empty dict is allowed by schema, but rule 6.6.1 forbids writing such files

# Canonical example (one entry per allowed bucket):
# changes:
#   requirements:
#     - id: R-002
#       class: CONFIRMED
#       content: "…"
#       reason: "…"
#   decisions:
#     - id: D-003
#       class: CONFIRMED
#       content: "…"
#       reason: "…"
#       revises: null               # or "D-001"
#   constraints:
#     - id: C-001
#       class: CONFIRMED
#       content: "…"
#   progress:
#     - id: P-002
#       content: "…"
#       evidence: "path/to/file.md"
#   open_questions:
#     - id: Q-001
#       content: "…"
#   rejected:
#     - id: X-001
#       content: "…"
#       reason: "…"
